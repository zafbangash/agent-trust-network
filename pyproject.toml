[project]
name = "agentframe"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "flask>=3.0",
    "requests>=2.31",
    "markdown>=3.6",
    "mcp>=1.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
